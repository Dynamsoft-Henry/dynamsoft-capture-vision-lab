// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.0.0' apply false
}

allprojects {
    repositories {
        maven { url "https://download2.dynamsoft.com/maven/aar" }
        google()
        mavenCentral()
    }
}


/***For debug***/
import java.util.concurrent.TimeUnit
def getLocalProperty(String name) {
    Properties properties = new Properties()
    if(project.rootProject.file('local.properties').exists()) {
        InputStream inputStream = project.rootProject.file('local.properties').newDataInputStream()
        properties.load(inputStream)
        return properties[name]
    } else {
        return null
    }
}
def localDynamsoftMaven = getLocalProperty("dynamsoftMaven")
def useLocalDynamsoftMaven = localDynamsoftMaven != null && !localDynamsoftMaven.trim().isEmpty()

allprojects {
    ext {
        useDynamsoftMaven = useLocalDynamsoftMaven
        if (useLocalDynamsoftMaven) {
            dynamsoftMaven = localDynamsoftMaven.trim()
        }
    }
    if (useLocalDynamsoftMaven) {
        configurations.all {
            resolutionStrategy.cacheChangingModulesFor 0, TimeUnit.SECONDS
        }
        repositories {
            maven {
                url localDynamsoftMaven.trim()
                allowInsecureProtocol true
            }
        }
    }
}